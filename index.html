<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:6px 10px;border-radius:8px}button:hover{background:var(--line)}

.hide{display:none!important}.mob{display:none}

 #list,#ed{grid-area:1/1}body:not(.edit) #ed{display:none}body.edit #list{display:none}

.tw{overflow-x:auto;margin:12px 0}#pv table{border-collapse:collapse;min-width:100%}

#pv th{background:var(--card);font-weight:600}#pv tbody tr:nth-child(even){background:rgba(127,127,127,.07)}
.zen #side,.zen #list,.zen .rz{display:none}.zen #app{grid-template-columns:1fr}

#st{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;padding:0 6px}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
#list{overflow-x:hidden}.card b,.card p,.card small{overflow-wrap:anywhere}.nav{gap:8px}
#pv img.miss{display:inline-block;min-width:140px;min-height:48px;padding:10px;border:1px dashed var(--tb);border-radius:8px;color:var(--mut);cursor:pointer}
.pdf{width:100%;height:70vh;border:1px solid var(--tb);border-radius:8px;margin:8px 0}

// ---- autosave: local draft on every keystroke, server save ~0.35s after a pause (max 3s while typing), retry, flush on exit
let rT,maxT=0,saving=false,retry=0,hAt=0;const dirty=new Map(),setSt=(t,c)=>{$('#st').textContent=t;$('#st').style.color=c||''};

// ---- Google Drive sync: two-way, top-level .md files of one Drive folder (your Obsidian vault)
const GAPI='https://www.googleapis.com/',tm=s=>+new Date(s);let gTok,gExp=0;

let idByPath={};
async function ensureDir(path,root){let pid=root,acc='';
 for(const x of path.split('/').filter(Boolean)){acc=acc?acc+'/'+x:x;
  if(!idByPath[acc]){
   const j=await(await gf(`${GAPI}drive/v3/files?pageSize=1&fields=files(id)&q=${encodeURIComponent(`'${pid}' in parents and name='${q1(x)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}`)).json();
   if(j.files.length)idByPath[acc]=j.files[0].id;
   else{const r=await gf(`${GAPI}drive/v3/files?fields=id`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:x,mimeType:'application/vnd.google-apps.folder',parents:[pid]})});idByPath[acc]=(await r.json()).id}}

async function put(n,root,f){const b='b'+Math.random().toString(36).slice(2),name=(n.title||'Untitled').replace(/[\\/:*?"<>|]/g,'-')+'.md',dest=await ensureDir(dirOf(n),root);

  body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(f?{name}:{name,parents:[dest]})}\r\n--${b}\r\nContent-Type: text/markdown; charset=UTF-8\r\n\r\n${n.body}\r\n--${b}--`});

 while(lvl.length){const next=[];
  await Promise.all(lvl.map(async([id,path])=>{let pt='';
   do{const j=await(await gf(`${GAPI}drive/v3/files?pageSize=1000&fields=nextPageToken,files(id,name,mimeType,modifiedTime,parents)&q=${encodeURIComponent(`'${id}' in parents and trashed=false`)}${pt?'&pageToken='+encodeURIComponent(pt):''}`)).json();
    for(const f of j.files){
     if(f.mimeType==='application/vnd.google-apps.folder'){if(!f.name.startsWith('.')){const p=path?path+'/'+f.name:f.name;idByPath[p]=f.id;next.push([f.id,p])}}
     else if(f.name.endsWith('.md'))files.push({...f,dir:path});else if(/\.(png|jpe?g|gif|webp|svg|bmp|avif|pdf)$/i.test(f.name))assets[f.name]=f.id}
    pt=j.nextPageToken}while(pt)}));
  lvl=next}
 return files}
const pickFolder=async()=>{const v=prompt('Paste your Google Drive vault folder link (or its ID):',user.user_metadata.folder||'');if(!v)return;
 const folder=(v.match(/folders\/([\w-]+)/)||[,v.trim()])[1],{data,error}=await sb.auth.updateUser({data:{folder}});
 if(error)throw error;user=data.user;return folder};
$('#fold').onclick=()=>pickFolder().catch(e=>alert(e.message));
$('#sync').onclick=async()=>{const btn=$('#sync'),label=btn.textContent;
 try{await gAuth();btn.textContent='⇄ Syncing…';
  const root=user.user_metadata.folder||await pickFolder();if(!root)return;
  const files=await walk(root),byId=Object.fromEntries(files.map(f=>[f.id,f])),linked=new Set();let up=0,down=0;
  for(const n of notes){const f=byId[n.drive_id];if(f)linked.add(f.id);
   const noteNew=!f||!n.drive_mtime||tm(n.updated_at)>tm(n.drive_mtime),fileNew=f&&tm(f.modifiedTime)!==tm(n.drive_mtime);
   if(fileNew&&(!noteNew||tm(f.modifiedTime)>=tm(n.updated_at))){
    const remote=await media(f.id);
    if(noteNew&&remote!==n.body){const {data:c}=await sb.from('notes').insert({title:n.title+' (conflict copy)',body:n.body,notebook:n.notebook}).select().single();if(c)notes.push(c)}
    n.body=remote;n.title=f.name.slice(0,-3);n.notebook=f.dir||ROOT;n.updated_at=n.drive_mtime=f.modifiedTime;down++}
   else if(noteNew){if(!f)n.drive_id=null;await put(n,root,f);up++}
   else if(f.dir!==dirOf(n)){n.notebook=f.dir||ROOT;down++}
   else continue;
   await sb.from('notes').upsert(n)}
  await Promise.all(files.filter(f=>!linked.has(f.id)).map(async f=>{
   const {data}=await sb.from('notes').insert({title:f.name.slice(0,-3),body:await media(f.id),notebook:f.dir||ROOT,drive_id:f.id,drive_mtime:f.modifiedTime,updated_at:f.modifiedTime}).select().single();
   if(data){notes.push(data);down++}}));
  localStorage.assets=JSON.stringify(assets);render();if(cur)openNote(cur.id);alert(`Drive synced: ${up} uploaded, ${down} downloaded`)
 }catch(e){alert(e.message||e)}finally{btn.textContent=label}};
// ---- Drive-hosted images & PDFs: Obsidian embeds ![[name.png]] are looked up in the vault and cached on this device
const ATTACH='ZUsed in Above Files',IMG=/\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i,assets=JSON.parse(localStorage.assets||'{}'),nameUrl=new Map();
const q1=s=>s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function blobFor(id,sl){const c=await caches.open('drv'),k='/drv/'+id;let r=await c.match(k);
 if(!r){r=await gf(`${GAPI}drive/v3/files/${id}?alt=media`,{},sl);await c.put(k,r.clone())}
 return URL.createObjectURL(await r.blob())}
async function assetUrl(nm,sl){if(nameUrl.has(nm))return nameUrl.get(nm);let id=assets[nm];
 if(!id){const j=await(await gf(`${GAPI}drive/v3/files?pageSize=1&fields=files(id)&q=${encodeURIComponent(`name='${q1(nm)}' and trashed=false`)}`,{},sl)).json();
  if(!j.files.length)throw Error('not found');id=assets[nm]=j.files[0].id;localStorage.assets=JSON.stringify(assets)}
 const u=await blobFor(id,sl);nameUrl.set(nm,u);return u}
const emb=t=>t.replace(/!\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]/g,(m,n,w)=>{const f=n.trim().split('/').pop(),e=esc(f);
 return /\.pdf$/i.test(f)?`<a data-drv="${e}" href="#">📄 ${e}</a>`:IMG.test(f)?`<img data-drv="${e}" alt="${e}"${/^\d+$/.test(w||'')?` width="${w}"`:''}>`:m});
function resolveImgs(){$('#pv').querySelectorAll('img').forEach(async im=>{try{let nm=im.dataset.drv;
 if(!nm){const s=im.getAttribute('src')||'';if(!s||/^(https?:|data:|blob:)/i.test(s))return;nm=decodeURIComponent(s.split('?')[0]).split('/').pop();im.dataset.drv=nm;im.removeAttribute('src')}
 if(nameUrl.has(nm)){im.src=nameUrl.get(nm);return}
 im.src=await assetUrl(nm,true);im.classList.remove('miss')}catch{im.classList.add('miss')}})}
$('#pv').addEventListener('click',async e=>{const a=e.target.closest('a[data-drv]');
 if(a){e.preventDefault();e.stopPropagation();const n=a.nextElementSibling;if(n&&n.tagName==='IFRAME')return n.remove();
  try{await gAuth();const f=document.createElement('iframe');f.className='pdf';f.src=await assetUrl(a.dataset.drv,true);a.after(f)}catch(x){alert(x.message||x)}return}
 if(e.target.closest('img.miss')){try{await gAuth();resolveImgs()}catch{}}},true);
// ---- layout: resizable / collapsible panes, focus (zen) mode
let lay=JSON.parse(localStorage.lay||'{"sw":230,"lw":320}');
const applyLay=()=>{const st=$('#app').style;st.setProperty('--sw',(lay.hs?0:lay.sw)+'px');st.setProperty('--lw',(lay.hl?0:lay.lw)+'px');
 B.classList.toggle('hs',!!lay.hs);B.classList.toggle('hl',!!lay.hl);localStorage.lay=JSON.stringify(lay)};
$('#tS').onclick=()=>{lay.hs=!lay.hs;applyLay()};$('#tL').onclick=()=>{lay.hl=!lay.hl;applyLay()};
document.querySelectorAll('.rz').forEach(h=>h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);
 const k=h.dataset.k,x0=e.clientX,w0=lay[k];
 h.onpointermove=m=>{lay[k]=Math.max(160,Math.min(600,w0+m.clientX-x0));lay[k==='sw'?'hs':'hl']=0;applyLay()};
 h.onpointerup=()=>{h.onpointermove=h.onpointerup=null}});
applyLay();
const zen=on=>{B.classList.toggle('zen',on);
 if(on){if(mode==='split'){mode='edit';$('#body').className='m-edit'}document.documentElement.requestFullscreen?.().catch(()=>{});$('#txt').focus()}
 else if(document.fullscreenElement)document.exitFullscreen()};
$('#zen').onclick=()=>zen(!B.classList.contains('zen'));
document.onfullscreenchange=()=>{if(!document.fullscreenElement)B.classList.remove('zen')};
document.onkeydown=e=>{if(e.key==='Escape'&&B.classList.contains('zen'))zen(false);
 if(e.altKey&&e.code==='KeyZ'){e.preventDefault();$('#zen').click()}
 if(e.ctrlKey&&e.code==='Backslash'){e.preventDefault();$('#tS').click()}};
boot();
